# L&S Emotion "Bielefeld" control via MQTT (e.g. ioBroker MQTT adapter as broker).
# Topics: <topic_prefix>/light/<name>/state and .../command ({"state":"ON"} / {"state":"OFF"}),
#         <topic_prefix>/button/<name>/command (PRESS),
#         <topic_prefix>/sensor/<name>/state
esphome:
  name: ls-bielefeld
  friendly_name: L&S Bielefeld

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

# Native API kept for logs/OTA from the ESPHome dashboard. reboot_timeout: 0s
# prevents the default reboot every 15 min when no API client is connected.
api:
  reboot_timeout: 0s

mqtt:
  broker: 192.168.1.10          # IP of your MQTT broker (e.g. the ioBroker host)
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: ls-bielefeld
  discovery: false              # set to true for Home Assistant MQTT discovery

ota:
  - platform: esphome

# Optional: local test page at http://<ip-of-the-esp32>
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://fewall/emotion-control-bielefeld
    components: [ls_bielefeld]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

ls_bielefeld:
  cs_pin: GPIO5
  remote_id: "12 34 56 78 9A BC DE F0"   # replace with the ID of YOUR remote

# One dimmable light per connected lamp channel (1-4)
light:
  - platform: ls_bielefeld
    name: "Channel 1"
    channel: 1
  - platform: ls_bielefeld
    name: "Channel 2"
    channel: 2
  - platform: ls_bielefeld
    name: "Channel 3"
    channel: 3

# Colour temperature of all lamps, 0 % = coldest, 100 % = warmest
number:
  - platform: ls_bielefeld
    name: "Colour temperature"

# Key currently pressed on the real remote ("" when released)
text_sensor:
  - platform: ls_bielefeld
    name: "Remote key"

button:
  - platform: ls_bielefeld
    name: "All on"
    key: ein
  - platform: ls_bielefeld
    name: "All off"
    key: aus
  - platform: ls_bielefeld
    name: "Warmer"
    key: sonne
  - platform: ls_bielefeld
    name: "Colder"
    key: schneeflocke

  # Holding a channel key dims it; the direction alternates with every hold.
  - platform: ls_bielefeld
    name: "Dim channel 1"
    key: kanal_1
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim channel 2"
    key: kanal_2
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim channel 3"
    key: kanal_3
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim all channels"
    key: [kanal_1, kanal_2, kanal_3]
    hold: 2s
