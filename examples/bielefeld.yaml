# L&S Emotion "Bielefeld" control via the native ESPHome API
# (Home Assistant, ioBroker ESPHome adapter, ...).
esphome:
  name: ls-bielefeld
  friendly_name: L&S Bielefeld

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

# Optional: local test page at http://<ip-of-the-esp32>
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://fewall/emotion-control-bielefeld
    components: [ls_bielefeld]

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

ls_bielefeld:
  cs_pin: GPIO5
  remote_id: "12 34 56 78 9A BC DE F0"   # replace with the ID of YOUR remote

# One light per connected lamp channel (1-4)
light:
  - platform: ls_bielefeld
    name: "Channel 1"
    channel: 1
  - platform: ls_bielefeld
    name: "Channel 2"
    channel: 2
  - platform: ls_bielefeld
    name: "Channel 3"
    channel: 3

# Key currently pressed on the real remote ("" when released)
text_sensor:
  - platform: ls_bielefeld
    name: "Remote key"

button:
  - platform: ls_bielefeld
    name: "All on"
    key: ein
  - platform: ls_bielefeld
    name: "All off"
    key: aus
  - platform: ls_bielefeld
    name: "Warmer"
    key: sonne
  - platform: ls_bielefeld
    name: "Colder"
    key: schneeflocke

  # Holding a channel key dims it; the direction alternates with every hold.
  - platform: ls_bielefeld
    name: "Dim channel 1"
    key: kanal_1
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim channel 2"
    key: kanal_2
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim channel 3"
    key: kanal_3
    hold: 2s
  - platform: ls_bielefeld
    name: "Dim all channels"
    key: [kanal_1, kanal_2, kanal_3]
    hold: 2s
